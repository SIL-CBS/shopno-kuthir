  const filterBar = (M) => { const o = (v, l, cur) => `<option value="${esc(v)}"${cur === v ? ' selected' : ''}>${l}</option>`; let h = '<div class="card"><div class="filters">';
    if (M.f.includes('month')) h += '<label for="fl-month">মাস' + (M.cum ? ' <span class="hint">এই মাস পর্যন্ত</span>' : '') + `<select id="fl-month" data-fl="month">${o('all', M.cum ? 'সব (আজ পর্যন্ত)' : 'সব মাস', FS.month)}${MONTHS.map((m) => o(m, M.cum ? mname(m) + ' পর্যন্ত' : mname(m), FS.month)).join('')}</select></label>`;
    if (M.f.includes('head')) h += `<label for="fl-head">খাত<select id="fl-head" data-fl="head">${o('all', 'সব খাত', FS.head)}${HEADS.map((x) => o(x, x, FS.head)).join('')}</select></label>`;
    if (M.f.includes('member')) h += `<label for="fl-member">সদস্য<select id="fl-member" data-fl="member">${o('all', 'সবাই', FS.member)}${MEMBERS.map((x) => o(x.id, x.name, FS.member)).join('')}</select></label>`;
    return h + '<button class="btn ghost" type="button" id="fl-reset">ফিল্টার মুছুন</button><div class="exp"><span class="k" id="ex-msg" aria-live="polite"></span><button class="btn ghost" type="button" data-ex="x">Excel</button><button class="btn ghost" type="button" data-ex="p">PDF খাড়া</button><button class="btn ghost" type="button" data-ex="l">PDF আড়াআড়ি</button></div></div></div>'; };
  const sidesTable = (S) => { const [a, b] = S, n = Math.max(a.rows.length, b.rows.length);
    const cell = (r, bl) => r ? `<td class="click${bl ? ' bl' : ''}${sel === r.key ? ' sel' : ''}" tabindex="0" data-k="${esc(r.key)}">${r.cells[0]}</td><td class="n click${sel === r.key ? ' sel' : ''}" data-k="${esc(r.key)}">${r.cells[1]}</td>` : `<td class="${bl ? 'bl' : ''}"></td><td></td>`;
    const tot = (r, bl) => `<td class="click${bl ? ' bl' : ''}" tabindex="0" data-k="${esc(r.key)}">${r.cells[0]}</td><td class="n click" data-k="${esc(r.key)}">${r.cells[1]}</td>`;
    let h = `<div class="tw"><table class="t4"><tr><th class="hh" colspan="2">${a.h}</th><th class="hh bl" colspan="2">${b.h}</th></tr><tr><th>বিবরণ</th><th class="n">টাকা</th><th class="bl">বিবরণ</th><th class="n">টাকা</th></tr>`;
    for (let i = 0; i < n; i++) h += '<tr>' + cell(a.rows[i], 0) + cell(b.rows[i], 1) + '</tr>';
    return h + '<tr class="tot">' + tot(a.total, 0) + tot(b.total, 1) + '</tr></table></div>'; };
  const calc = () => { const D = sum(of('dep')), X = sum(of('exp')), BO = sum(of('bout')), BI = sum(of('bin'));
    return {D, X, BO, BI, bank: D + BI - BO, cash: BO - BI - X}; };

  /* ================= রিপোর্ট ফরম্যাট (সবাই একই আকারে) =================
     { id, title, kind:'table'|'sides', build() -> {head, rows|left,right}, detail(key) -> {title, steps[], list[]} }
     row: {key, cells[], total?}   — key থাকলে সারি ক্লিক করা যায় */
  const entRow = (e) => [dmy(e.date), LBL[e.t], e.t === 'dep' ? mem(e.member).name + ' · ' + mname(e.month) : e.desc, fmt(e.amt)];
  const entTable = (list) => ({head:['তারিখ','ধরন','বিবরণ','টাকা'], list});
  const stepEq = (label, val) => `${label} = <b>${fmt(val)}</b>`;

  const REPORTS = {
    tb: {title:'ট্রায়াল ব্যালেন্স', kind:'sides', build() { const c = calc();
        const credit = [{key:'dep', cells:['শেয়ারহোল্ডারদের জমা', fmt(c.D)]}];
        const debit = [...HEADS.map((h) => ({key:'head:' + h, cells:[h, fmt(sum(of('exp').filter((e) => e.head === h)))]})).filter((r) => r.cells[1] !== fmt(0)),
          {key:'cash', cells:['নগদ (হাতে)', fmt(c.cash)]}, {key:'bank', cells:['ব্যাংক স্থিতি', fmt(c.bank)]}];
        const dt = c.X + c.cash + c.bank;
        return {sides:[{h:'ক্রেডিট', head:['বিবরণ','টাকা'], rows:credit, total:{key:'tot', cells:['মোট', fmt(c.D)]}},
                       {h:'ডেবিট', head:['বিবরণ','টাকা'], rows:debit, total:{key:'tot', cells:['মোট', fmt(dt)]}}],
                note: c.D === dt ? 'মিলেছে: দুই পাশের মোট সমান।' : 'অমিল: পার্থক্য ' + fmt(c.D - dt)}; },
      detail(k) { const c = calc();
        if (k === 'dep') return {title:'শেয়ারহোল্ডারদের জমা', steps:[stepEq('সব সদস্যের জমার যোগফল (' + toBn(of('dep').length) + 'টি এন্ট্রি)', c.D)], ...entTable(of('dep'))};
        if (k === 'cash') return {title:'নগদ (হাতে)', steps:['ব্যাংক থেকে তোলা: <b>' + fmt(c.BO) + '</b>', 'বিয়োগ ব্যাংকে ফেরত জমা: <b>' + fmt(c.BI) + '</b>', 'বিয়োগ মোট খরচ: <b>' + fmt(c.X) + '</b>', stepEq(fmt(c.BO) + ' − ' + fmt(c.BI) + ' − ' + fmt(c.X), c.cash)], ...entTable([...of('bout'), ...of('bin'), ...of('exp')])};
        if (k === 'bank') return REPORTS.bank.detail('close');
        if (k.startsWith('head:')) { const h = k.slice(5), l = of('exp').filter((e) => e.head === h); return {title:'খরচ: ' + h, steps:[toBn(l.length) + 'টি খরচের যোগ', stepEq(l.map((e) => fmt(e.amt)).join(' + '), sum(l))], ...entTable(l)}; }
        const d = calc(); return {title:'মোট মিলানো', steps:['ক্রেডিট মোট = জমা = <b>' + fmt(d.D) + '</b>', 'ডেবিট মোট = খরচ ' + fmt(d.X) + ' + নগদ ' + fmt(d.cash) + ' + ব্যাংক ' + fmt(d.bank) + ' = <b>' + fmt(d.X + d.cash + d.bank) + '</b>'], list:[]}; }},

    bs: {title:'ব্যালেন্স শিট', kind:'sides', build() { const c = calc();
        return {sides:[{h:'দায় ও তহবিল', head:['বিবরণ','টাকা'], rows:[{key:'dep', cells:['শেয়ারহোল্ডার তহবিল (জমা)', fmt(c.D)]}], total:{key:'tot', cells:['মোট', fmt(c.D)]}},
                       {h:'সম্পদ ও খরচ', head:['বিবরণ','টাকা'], rows:[{key:'cash', cells:['নগদ', fmt(c.cash)]},{key:'bank', cells:['ব্যাংক', fmt(c.bank)]},{key:'exp', cells:['এ পর্যন্ত মোট খরচ (নির্মাণে)', fmt(c.X)]}], total:{key:'tot', cells:['মোট', fmt(c.cash + c.bank + c.X)]}}],
                note:'দুই পাশ পাশাপাশি, এক পাতায়।'}; },
      detail(k) { if (k === 'exp') return {title:'মোট খরচ', steps:[stepEq('সব খাতের খরচের যোগ', calc().X)], ...entTable(of('exp'))}; return REPORTS.tb.detail(k); }},

    exh: {title:'খাতভিত্তিক খরচ', kind:'table', build() { const X = calc().X;
        const rows = HEADS.map((h) => { const l = of('exp').filter((e) => e.head === h); return {key:'head:' + h, cells:[h, toBn(l.length), fmt(sum(l)), X ? toBn((sum(l) * 100 / X).toFixed(1)) + '%' : '—'], n:[1,2,3]}; }).filter((r) => r.cells[1] !== toBn(0));
        return {head:['খাত','সংখ্যা','টাকা','শতাংশ'], num:[1,2,3], rows, total:{key:'all', cells:['মোট', toBn(of('exp').length), fmt(X), toBn('100.0') + '%']}}; },
      detail(k) { if (k === 'all') return {title:'মোট খরচ', steps:['সব খাতের যোগফল', stepEq('মোট', calc().X)], ...entTable(of('exp'))}; return REPORTS.tb.detail(k); }},

    exm: {title:'মাসভিত্তিক খরচ', kind:'table', build() { const rows = MONTHS.map((m) => { const l = of('exp').filter((e) => e.date.startsWith(m)); return {key:m, cells:[mname(m), toBn(l.length), fmt(sum(l))]}; });
        return {head:['মাস','সংখ্যা','টাকা'], num:[1,2], rows, total:{key:'all', cells:['মোট', toBn(of('exp').length), fmt(calc().X)]}}; },
      detail(k) { if (k === 'all') return REPORTS.exh.detail('all'); const l = of('exp').filter((e) => e.date.startsWith(k)); return {title:'খরচ: ' + mname(k), steps:[stepEq(l.map((e) => fmt(e.amt)).join(' + '), sum(l))], ...entTable(l)}; }},

    xtab: {title:'খাত × মাস (ক্রসট্যাব)', kind:'table', build() { const ex = of('exp'), X = sum(ex);
        const heads = HEADS.filter((h) => ex.some((e) => e.head === h)), at = (h, m) => sum(ex.filter((e) => e.head === h && e.date.startsWith(m)));
        const rows = heads.map((h) => ({ck:['row:' + h, ...MONTHS.map((m) => 'cell:' + h + '|' + m), 'row:' + h], cells:[h, ...MONTHS.map((m) => { const v = at(h, m); return v ? fmt(v) : '—'; }), fmt(sum(ex.filter((e) => e.head === h)))]}));
        return {head:['খাত', ...MONTHS.map(mname), 'মোট'], num:MONTHS.map((_, i) => i + 1).concat([MONTHS.length + 1]), rows,
          total:{ck:['all', ...MONTHS.map((m) => 'col:' + m), 'all'], cells:['মোট', ...MONTHS.map((m) => fmt(sum(ex.filter((e) => e.date.startsWith(m))))), fmt(X)]},
          note:'যেকোনো ঘর, খাতের নাম বা মোটে চাপ দিলে নিচে হিসাব দেখাবে।'}; },
      detail(k) { const ex = of('exp'), pre = k.split(':')[0], arg = k.slice(pre.length + 1);
        if (pre === 'cell') { const [h, m] = arg.split('|'), l = ex.filter((e) => e.head === h && e.date.startsWith(m)); return {title:h + ' · ' + mname(m), steps:[toBn(l.length) + 'টি এন্ট্রি', stepEq(l.map((e) => fmt(e.amt)).join(' + '), sum(l))], ...entTable(l)}; }
        if (pre === 'row') { const l = ex.filter((e) => e.head === arg), per = MONTHS.map((m) => [m, sum(l.filter((e) => e.date.startsWith(m)))]);
          return {title:arg + ' — মাস ধরে হিসাব', steps:[...per.map(([m, v], i) => 'ধাপ ' + toBn(i + 1) + ': ' + mname(m) + ' = <b>' + fmt(v) + '</b>'), stepEq('মোট = ' + per.map(([, v]) => fmt(v)).join(' + '), sum(l))], ...entTable(l)}; }
        if (pre === 'col') { const l = ex.filter((e) => e.date.startsWith(arg)), per = HEADS.map((h) => [h, sum(l.filter((e) => e.head === h))]).filter((x) => x[1]);
          return {title:mname(arg) + ' — খাত ধরে হিসাব', steps:[...per.map(([h, v], i) => 'ধাপ ' + toBn(i + 1) + ': ' + h + ' = <b>' + fmt(v) + '</b>'), stepEq('মোট', sum(l))], ...entTable(l)}; }
        const per = MONTHS.map((m) => [m, sum(ex.filter((e) => e.date.startsWith(m)))]);
        return {title:'সর্বমোট খরচ', steps:[...per.map(([m, v]) => mname(m) + ' = <b>' + fmt(v) + '</b>'), stepEq('সর্বমোট = ' + per.map(([, v]) => fmt(v)).join(' + '), sum(ex))], ...entTable(ex)}; }},

    due: {title:'বকেয়া ও অগ্রিম', kind:'table', build() { const n = nM();
        const rows = msF().map((m) => { const dep = sum(of('dep').filter((e) => e.member === m.id)), due = m.rate * n, bal = dep - due;
          return {key:m.id, cells:[m.name, m.share, fmt(m.rate), fmt(due), fmt(dep), (bal < 0 ? 'বকেয়া ' : 'অগ্রিম ') + fmt(Math.abs(bal))], cls:bal < 0 ? 'bad' : 'ok'}; });
        const tdue = msF().reduce((s, m) => s + m.rate * n, 0), tdep = sum(of('dep').filter((e) => mem(e.member))), tb = tdep - tdue;
        return {head:['সদস্য','শেয়ার','মাসিক চাঁদা','এ পর্যন্ত পাওনা','জমা','অবস্থা'], num:[2,3,4,5], rows, total:{key:'all', cells:['মোট', '', '', fmt(tdue), fmt(tdep), (tb < 0 ? 'বকেয়া ' : 'অগ্রিম ') + fmt(Math.abs(tb))]},
          note:'পাওনা = মাসিক চাঁদা × ' + toBn(n) + ' মাস।'}; },
      detail(k) { const n = nM();
        if (k === 'all') { const tdue = msF().reduce((s, m) => s + m.rate * n, 0), tdep = sum(of('dep')); return {title:'সবার মোট', steps:['সবার পাওনা = ' + msF().map((m) => fmt(m.rate * n)).join(' + ') + ' = <b>' + fmt(tdue) + '</b>', 'সবার জমা = <b>' + fmt(tdep) + '</b>', stepEq(fmt(tdep) + ' − ' + fmt(tdue) + ' (ঋণাত্মক হলে বকেয়া)', tdep - tdue)], ...entTable(of('dep'))}; }
        const m = mem(k), l = of('dep').filter((e) => e.member === k), dep = sum(l), due = m.rate * n;
        return {title:m.name + ' — হিসাব', steps:['ধাপ ১: শেয়ার ' + m.share + ', মাসিক চাঁদা <b>' + fmt(m.rate) + '</b>', 'ধাপ ২: ' + toBn(n) + ' মাসের পাওনা = ' + fmt(m.rate) + ' × ' + toBn(n) + ' = <b>' + fmt(due) + '</b>', 'ধাপ ৩: মোট জমা = ' + (l.map((e) => fmt(e.amt)).join(' + ') || '০') + ' = <b>' + fmt(dep) + '</b>', 'ধাপ ৪: ' + fmt(dep) + ' − ' + fmt(due) + ' = <b>' + fmt(dep - due) + '</b> → ' + (dep - due < 0 ? 'বকেয়া' : 'অগ্রিম/সমান')], ...entTable(l)}; }},

    dep: {title:'জমার তালিকা', kind:'table', build() { const l = [...of('dep')].sort((a, b) => a.date < b.date ? 1 : -1);
        return {head:['তারিখ','সদস্য','কোন মাসের','টাকা'], num:[3], rows:l.map((e) => ({key:'e' + E.indexOf(e), cells:[dmy(e.date), mem(e.member).name, mname(e.month), fmt(e.amt)]})), total:{key:'all', cells:['মোট', '', '', fmt(calc().D)]}}; },
      detail(k) { if (k === 'all') return REPORTS.tb.detail('dep'); const e = E[+k.slice(1)]; return {title:'এই জমা', steps:['সদস্য: ' + mem(e.member).name, 'তারিখ ' + dmy(e.date) + ': ১০ তারিখ পর্যন্ত জমা আগের মাসে ধরার নিয়মে মাস প্রস্তাব হয়, এখানে <b>' + mname(e.month) + '</b>', stepEq('টাকা', e.amt)], list:[]}; }},

    bank: {title:'ব্যাংক স্টেটমেন্ট', kind:'table', build() { const l = E.filter((e) => ['dep','bin','bout'].includes(e.t) && inScope(e)).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); let bal = 0;
        const rows = l.map((e) => { const inn = e.t !== 'bout'; bal += inn ? e.amt : -e.amt; return {key:'e' + E.indexOf(e), cells:[dmy(e.date), e.t === 'dep' ? mem(e.member).name + ' জমা' : e.desc, inn ? fmt(e.amt) : '', inn ? '' : fmt(e.amt), fmt(bal)]}; });
        return {head:['তারিখ','বিবরণ','জমা','উত্তোলন','স্থিতি'], num:[2,3,4], rows, total:{key:'close', cells:['সমাপনী স্থিতি', '', fmt(calc().D + calc().BI), fmt(calc().BO), fmt(calc().bank)]}}; },
      detail(k) { const c = calc(); if (k === 'close') return {title:'সমাপনী ব্যাংক স্থিতি', steps:['মোট জমা (শেয়ারহোল্ডার + নগদ জমা) = ' + fmt(c.D) + ' + ' + fmt(c.BI) + ' = <b>' + fmt(c.D + c.BI) + '</b>', 'মোট উত্তোলন = <b>' + fmt(c.BO) + '</b>', stepEq(fmt(c.D + c.BI) + ' − ' + fmt(c.BO), c.bank)], ...entTable([...of('dep'), ...of('bin'), ...of('bout')])};
        const e = E[+k.slice(1)]; return {title:'এই লাইন', steps:[LBL[e.t] + ' · ' + dmy(e.date) + ' · ' + fmt(e.amt)], list:[e]}; }}
  };

  /* ================= এন্ট্রি ফরম্যাট (সব ফর্ম একই আকারে) =================
     fields: {k, label, type:'date'|'num'|'text'|'select', opts?, hint?, req?} */
  const memOpts = () => MEMBERS.map((m) => [m.id, m.name]);
  const FORMS = {
    exp:{title:'খরচ এন্ট্রি', fields:[{k:'date',label:'তারিখ',type:'date',req:1},{k:'amt',label:'টাকা (ইংরেজি অঙ্কে)',type:'num',req:1},{k:'desc',label:'বিবরণ',type:'text',req:1,hint:'যেমন: সিমেন্ট ১০০ বস্তা'},{k:'head',label:'খাত',type:'select',opts:() => HEADS.map((h) => [h, h]),req:1}]},
    bank:{title:'ব্যাংক এন্ট্রি', typed:[['bin','জমা'],['bout','উত্তোলন']], fields:[{k:'date',label:'তারিখ',type:'date',req:1},{k:'amt',label:'টাকা',type:'num',req:1},{k:'desc',label:'বিবরণ',type:'text',req:1},{k:'chq',label:'চেক নং',type:'text'}]},
    dep:{title:'শেয়ারহোল্ডারের জমা', fields:[{k:'date',label:'তারিখ',type:'date',req:1},{k:'amt',label:'টাকা',type:'num',req:1},{k:'member',label:'কে জমা দিলেন',type:'select',opts:memOpts,req:1},{k:'month',label:'কোন মাসের',type:'select',opts:() => MONTHS.map((m) => [m, mname(m)]),req:1,hint:'১০ তারিখ পর্যন্ত হলে আগের মাস প্রস্তাব হবে'}]}
  };
  const todayIso = () => new Date().toISOString().slice(0, 10);
  const guessMonth = (d) => { if (!d) return MONTHS[MONTHS.length - 1]; const y = +d.slice(0, 4), m = +d.slice(5, 7), dd = +d.slice(8); let k = d.slice(0, 7); if (dd <= 10) { const p = new Date(y, m - 2, 1); k = p.getFullYear() + '-' + String(p.getMonth() + 1).padStart(2, '0'); } return MONTHS.includes(k) ? k : MONTHS[MONTHS.length - 1]; };

  /* ================= মেনু tree (গ্রুপ → উপগ্রুপ → পাতা) ================= */
  const MENU = [
    {id:'dashboard', label:'ড্যাশবোর্ড', view:'dash'},
    {id:'g-entry', label:'এন্ট্রি', top:1, children:[
      {id:'en-exp', label:'খরচ', view:'form', form:'exp'},
      {id:'g-bank', label:'ব্যাংক', children:[{id:'en-bin', label:'ব্যাংকে জমা', view:'form', form:'bank', type:'bin'},{id:'en-bout', label:'ব্যাংক থেকে উত্তোলন', view:'form', form:'bank', type:'bout'}]},
      {id:'en-dep', label:'শেয়ারহোল্ডারের জমা', view:'form', form:'dep'},

    ['H','জমার মাস: ১০ তারিখ পর্যন্ত হলে আগের মাস','ok','আছে','en-dep',''],
    ['H','শেয়ারহোল্ডারের নাম Banglish-এ খোঁজা','part','ড্রপডাউনে বাছতে হয়','en-dep','২৯ জনের তালিকা ঢুকলে খোঁজাও লাগবে।'],
    ['H','এন্ট্রির তালিকা, মোছা','ok','সব এন্ট্রির তালিকা','en-all',''],
    ['H','ডেটাবেসে সংরক্ষণ','miss','এখনো নমুনা, কোথাও জমা হয় না','','আসল ডেটার ধাপে হবে।'],
    ['N','tree-style মেনু, এক ডেটা থেকে সব পাতা','new','পুরো অ্যাপ','dashboard','নতুন রিপোর্ট বা ফর্ম যোগ করা কনফিগে এক লাইন।'],
    ['N','এন্ট্রি দিলে সব রিপোর্ট ও ড্যাশবোর্ড সাথে সাথে বদলায়','new','এন্ট্রি মেনু','en-exp',''],
    ['N','প্রতিটা রিপোর্টে ফিল্টার (মাস, খাত, সদস্য)','new','রিপোর্ট মেনু','rep-due',''],
    ['N','প্রতিটা রিপোর্টে Excel (আসল সংখ্যা, যোগ-বিয়োগ চলে)','new','রিপোর্ট মেনু','rep-tb',''],
    ['N','খাত × মাস ক্রসট্যাব, প্রতিটা ঘর খোলে','new','খরচ › ক্রসট্যাব','rep-xtab',''],
    ['N','TB ও BS-এ দুই পাশের মোট একই লাইনে, পাশাপাশি','new','আর্থিক বিবরণী','rep-tb',''],
    ['N','ডেস্কটপ ও ফোনে একই মেনু (ফোনে ☰ থেকে খোলে)','new','পুরো অ্যাপ','dashboard','']
  ];
  let CF = 'all';
  function viewCmp() { const cnt = (k) => CMP.filter((r) => k === 'all' ? r[0] !== 'N' : r[2] === k).length, old = CMP.filter((r) => r[0] !== 'N');
    const cards = [['all', 'পুরনোর মোট আইটেম', old.length, ''], ['ok', '✓ আছে', cnt('ok'), 'ok'], ['part', '≈ আংশিক', cnt('part'), 'part'], ['miss', '✕ এখনো নেই', cnt('miss'), 'miss'], ['new', '↗ শুধু নতুনে', cnt('new'), 'new']];
    const rows = CMP.filter((r) => CF === 'all' ? true : r[2] === CF || (CF === 'new' && r[0] === 'N')).filter((r) => CF !== 'all' || true);
    let h = '<div class="stack"><div class="card"><p style="margin:0">পুরনো ড্যাশবোর্ড ও আগের এন্ট্রি-নমুনার প্রতিটা জিনিস নতুন ভার্সনের সাথে মিলিয়ে দেখা হয়েছে। এটা কাঠামো ও কাজের তুলনা। নতুন ভার্সনে এখনো নমুনা ডেটা, তাই অংক মেলানো হয়নি। আসল ডেটা ঢোকালে অংক পুরনোর সাথে মিলিয়ে দেখব।</p></div>' +
      '<div class="cards">' + cards.map(([k, l, n, c]) => `<button class="card click${CF === k ? ' on' : ''}" type="button" data-cf="${k}"><div class="k">${l}</div><div class="big">${toBn(n)}</div><div class="go">${CF === k ? 'এটাই দেখাচ্ছে' : 'শুধু এগুলো দেখুন →'}</div></button>`).join('') + '</div>' +
      '<div class="card"><div class="tw"><table class="cmp"><tr><th>আগে যা ছিল</th><th>অবস্থা</th><th>নতুনে কোথায়</th><th>মন্তব্য</th></tr>';
    let last = '';
    rows.forEach((r, i) => { const [g, a, st, nw, to, note] = r; if (g !== last) { last = g; h += `<tr class="grp"><td colspan="4">${SC[g]}</td></tr>`; }
      h += `<tr${to ? ` class="click" tabindex="0" data-go="${to}"` : ''}><td>${a}</td><td><span class="pill ${ST[st][1]}">${ST[st][0]}</span></td><td>${nw}${to ? ' <span class="go">→ দেখুন</span>' : ''}</td><td class="k">${note}</td></tr>`; });
    h += '</table></div></div>';
    const gaps = ['এন্ট্রি ফর্মে ফিরিয়ে আনা: Banglish → বাংলা, খাত প্রস্তাব, ক্রমিক ও পৃষ্ঠা, ডুপ্লিকেট যাচাই', 'বকেয়ার আসল নিয়ম: ছাদে ১০% চক্রবৃদ্ধি, আগে ছাদ পরে কিস্তি', 'ব্যাংকের মিল ও গরমিল, সার্ভিস চার্জ ও অন্যান্য পরিশোধ TB-তে', 'বাজেট বনাম খরচ, পূর্বাভাস, যাচাই ও নোট', 'সার্চ, চুক্তিপত্র ও বিশ্লেষণ: দরকার হলে পুরনো সাইটেই রেখে লিংক দেওয়া'];
    h += '<div class="card"><h3>আসল ডেটার আগে কোনটা আগে আনা উচিত (আমার প্রস্তাব, ক্রম ধরে)</h3><ol class="steps">' + gaps.map((x) => `<li>${x}</li>`).join('') + '</ol></div></div>';
    $('#view').innerHTML = h;
    $$('[data-cf]').forEach((b) => b.addEventListener('click', () => { CF = CF === b.dataset.cf ? 'all' : b.dataset.cf; viewCmp(); }));
    $$('#view tr[data-go]').forEach((tr) => { const go = () => { location.hash = tr.dataset.go; }; tr.addEventListener('click', go); tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); }); }); }

  /* ================= রাউটিং (#id) ================= */
  function route() { let id = location.hash.slice(1); if (!FLAT[id] || FLAT[id].children) id = 'dashboard'; if (id !== cur) { cur = id; if (!location.hash.includes('keep')) { if (!FLAT[id].rep) sel = sel; } }
    for (let p = PARENT[id]; p; p = PARENT[p]) open.add(p);
    const n = FLAT[id]; $('#title').textContent = n.label; $('#crumb').textContent = crumbOf(id); document.title = n.label + ' · স্বপ্ন কুঠির হিসাব'; drawTree();
    if (n.view === 'dash') { sel = null; viewDash(); } else if (n.view === 'report') viewReport(n.rep) ; else if (n.view === 'form') { sel = null; viewForm(n); } else if (n.view === 'list') viewList(); else if (n.view === 'cmp') { sel = null; viewCmp(); } else if (n.view === 'heads') viewHeads(); else viewMembers(); }
  addEventListener('hashchange', route);
  $('#mb').addEventListener('click', () => document.body.classList.toggle('open'));
  document.addEventListener('click', (e) => { if (document.body.classList.contains('open') && !e.target.closest('#side') && !e.target.closest('#mb')) document.body.classList.remove('open'); });
  route();
})();
</script>
