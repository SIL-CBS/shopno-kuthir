<style>:root{--bg:#f4f6f8;--fg:#1d2733;--mu:#5b6b7a;--pa:#fff;--bd:#d5dde5;--ac:#15324f}

button{width:100%;font:inherit;padding:10px;border:0;border-radius:8px;background:var(--ac);color:var(--pa);cursor:pointer}
