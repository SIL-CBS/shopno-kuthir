    const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: u8(P.i)}, k, u8(P.c)));
    try { if (document.getElementById('r') && document.getElementById('r').checked) localStorage.setItem('sk_pw', pw); } catch (e) {}
    document.open(); document.write(html); document.close(); return true;
  } catch (e) {
    if (!quiet) document.getElementById('e').textContent = 'পাসওয়ার্ড ঠিক নয় · Wrong password';
    try { if (quiet) localStorage.removeItem('sk_pw'); } catch (x) {}

  }
}
