name: Shopno Kuthir — Android APK
on:
  push:
    branches: [main]
    paths: ['shopno-app/**', 'v2/index.html', '.github/workflows/shopno-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: shopno-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: mkdir -p www && cp ../v2/index.html www/index.html
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && VERSION_CODE=${{ github.run_number }} ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk shopno-kuthir.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: shopno-kuthir-latest
          name: Shopno Kuthir app (debug build)
          prerelease: true
          make_latest: false
          files: shopno-app/shopno-kuthir.apk
          body: "স্বপ্ন কুঠির Android অ্যাপ (debug build)। চালু করতে অ্যাপের পাসওয়ার্ড লাগবে।"
